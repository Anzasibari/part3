<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIO · Enquiry</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-flex">
      <div class="logo"><i class="fas fa-crown"></i>TRIO<span>.</span></div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="Blog.html">Blog</a>
        <a href="contact.html">Contact</a>
        <a href="Bookings.html" class="btn-outline"><i class="fas fa-calendar-check"></i> Bookings</a>
      </div>
    </div>
  </nav>

  <section style="padding-top: 3rem;">
    <div class="container">
      <h2 class="section-title"><i class="fas fa-question-circle"></i> General Enquiry</h2>
      <p class="section-sub">Have a question? We're here to help. Fill out the form and we'll respond promptly.</p>
      <div style="background:white; padding:2.5rem; border-radius:30px; border:1px solid #edeae6; max-width:700px;">
        <form>
          <div style="margin-bottom:1rem;"><label style="font-weight:600;">Your name</label><br><input type="text" placeholder="Full name" style="width:100%; padding:0.8rem; border-radius:40px; border:1px solid #dccfc4; margin-top:0.3rem;"></div>
          <div style="margin-bottom:1rem;"><label style="font-weight:600;">Email address</label><br><input type="email" placeholder="you@example.com" style="width:100%; padding:0.8rem; border-radius:40px; border:1px solid #dccfc4; margin-top:0.3rem;"></div>
          <div style="margin-bottom:1rem;"><label style="font-weight:600;">Your enquiry</label><br><textarea rows="4" placeholder="Tell us how we can help..." style="width:100%; padding:0.8rem; border-radius:20px; border:1px solid #dccfc4; margin-top:0.3rem;"></textarea></div>
          <button type="submit" style="background:#b48b6b; color:white; border:none; padding:0.8rem 2rem; border-radius:40px; font-weight:600; font-size:1rem; cursor:pointer;">Submit enquiry</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div><div class="logo"><i class="fas fa-crown"></i>TRIO<span>.</span></div><p style="margin-top:0.5rem;">Hospitality. Elevated.</p></div>
        <div><h4 style="color:#f0ebe6;">Contact</h4><p style="color:#b0a89e;">hello@trio.hospitality</p></div>
      </div>
      <div class="footer-bottom"><i class="fas fa-crown" style="color:#b48b6b;"></i> TRIO — Every guest, every moment, exceptional.</div>
    </div>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
